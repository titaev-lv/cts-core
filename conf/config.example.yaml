# CTS-Core Configuration Example
# Copy this file to config.yaml and customize for your environment

# Environment: development | production
environment: development

# Server configuration (REST API - Phase 1.5)
server:
  host: "0.0.0.0"
  port: 8080
  
  tls:
    enabled: false
    cert_path: "pki/server/cts-core.crt"
    key_path: "pki/server/cts-core.key"
    ca_path: "pki/ca/ca.crt"
    
  timeouts:
    read: 30s
    write: 30s
    idle: 120s

# MySQL Database configuration
mysql:
  host: "mysql"
  port: 3306
  user: "root"
  password: "root"          # TODO: Use env var CTS_MYSQL_PASSWORD in production
  database: "ct_system"
  
  pool:
    max_open_conns: 25
    max_idle_conns: 10
    conn_max_lifetime: 300s      # 5 minutes
    
  tls:
    enabled: false               # Set to true for production with mTLS certificates
    ca_path: "pki/ca/ca.crt"
    cert_path: "pki/client/cts-core-mysql.crt"
    key_path: "pki/client/cts-core-mysql.key"
    
  retry:
    max_attempts: 3
    initial_delay: 100ms
    max_delay: 5s
    multiplier: 2.0

# HSM Service configuration
# Two contexts: Trading (exchange keys) + 2FA (user secrets)
hsm:
  url: "https://hsm:8443"
  timeout: 10s
  
  retry:
    max_attempts: 5
    initial_delay: 200ms
    max_delay: 10s
    multiplier: 2.0
  
  # Trading context (exchange API keys encryption)
  trading:
    context: "exchange-key"
    tls:
      enabled: true
      ca_path: "pki/ca/ca.crt"
      cert_path: "pki/hsm-service/clients/cts-core-trader/cts-core-hsm-trader.crt"
      key_path: "pki/hsm-service/clients/cts-core-trader/cts-core-hsm-trader.key"
  
  # 2FA context (user 2FA secrets - for re-encryption job only)
  two_fa:
    context: "2fa"
    tls:
      enabled: true
      ca_path: "pki/ca/ca.crt"
      cert_path: "pki/hsm-service/clients/cts-core-2fa/cts-core-hsm-2fa.crt"
      key_path: "pki/hsm-service/clients/cts-core-2fa/cts-core-hsm-2fa.key"

# State management
state:
  file_path: "state/daemon.state"
  sync_interval: 30s             # Sync to MySQL every 30 seconds
  backup_count: 3                # Keep 3 backup copies

# Logging configuration
logging:
  level: debug                   # debug | info | warn | error
  dir: logs                      # Directory for log files
  error_path: "logs/error.log"
  access_path: "logs/access.log"
  out_request_path: "logs/out_request.log"
  ws_access_path: "logs/ws_access.log"
  ws_out_path: "logs/ws_out.log"
  audit_path: "logs/audit.log"
  max_size_mb: 100               # Rotate when file reaches 100 MB
  max_backups: 10                # Number of rotated files to keep
  max_age_days: 30               # Max age in days before deletion
  compress: true                 # Compress rotated files
  access_to_stdout: true
  out_request_to_stdout: false
  ws_access_to_stdout: false
  ws_out_to_stdout: false
  audit_to_stdout: false
  post_payload: false
  post_payload_max_bytes: 2048
  ws_debug: false

# Session management (Phase 1.4)
session:
  heartbeat_interval: 5s
  heartbeat_timeout: 15s         # 3 missed heartbeats
  grace_period: 60s
  cleanup_interval: 300s         # 5 minutes

# Task scheduler (Phase 1.4)
scheduler:
  task_assignment_interval: 1s
  latency_check_interval: 60s
  resource_check_interval: 30s

# Rate limiting (Phase 1.5)
rate_limit:
  rest:
    requests_per_minute: 1000
    burst: 100
    
  websocket:
    messages_per_minute: 10000
    burst: 1000

# Prometheus metrics (Phase 1.6)
metrics:
  enabled: true
  port: 9090
  path: "/metrics"

# Audit logging
audit:
  enabled: true
  file_path: "logs/audit.log"
  mysql_enabled: false           # Phase 2: store in MySQL
  retention_days: 30

