# CTS-Core Configuration Example
# Copy this file to config.yaml and customize for your environment

# Server configuration (REST API - Phase 1.5)
server:
  port: 8080
  
  tls:
    cert_path: "pki/server/cts-core.crt"
    key_path: "pki/server/cts-core.key"
    ca_path: "pki/ca/ca.crt"
    allowed_client_common_names:
      - "trader-1-cts-client"
      - "trader-2-cts-client"
      - "trader-3-cts-client"
    allowed_client_organizational_units:
      - "Trading"
    allowed_client_dns_names: []
    
  timeouts:
    read: 30s
    write: 30s
    idle: 120s
    read_header: 5s
    shutdown_grace: 10s
  limits:
    max_header_bytes: 1048576
  http2:
    max_concurrent_streams: "250"
    initial_window_size: "64k"
    max_frame_size: "16k"
    max_header_list_size: "1M"
    idle_timeout_seconds: 120
    max_upload_buffer_per_conn: "1M"
    max_upload_buffer_per_stream: "1M"

# Databases configuration
databases:
  system:
    engine: "mysql"
    mysql:
      host: "mysql"
      port: 3306
      user: "cts-core"
      password: "root"          # TODO: Use env var CTS_DATABASES_SYSTEM_MYSQL_PASSWORD in production
      database: "ct_system"

      pool:
        max_open_conns: 25
        max_idle_conns: 10
        conn_max_lifetime: 300s      # 5 minutes

      tls:
        enabled: true
        ca_path: "pki/ca/ca.crt"
        cert_path: "pki/client/cts-core-mysql.crt"
        key_path: "pki/client/cts-core-mysql.key"

      retry:
        max_attempts: 3
        initial_delay: 100ms
        max_delay: 5s
        multiplier: 2.0

  audit:
    engine: ""

  quotes:
    engine: ""

# HSM Service configuration
# Two contexts: Trading (exchange keys) + 2FA (user secrets)
hsm:
  url: "https://hsm:8443"
  timeout: 10s
  
  retry:
    max_attempts: 5
    initial_delay: 200ms
    max_delay: 10s
    multiplier: 2.0
  
  # Trading context (exchange API keys encryption)
  trading:
    context: "exchange-key"
    tls:
      enabled: true
      ca_path: "pki/ca/ca.crt"
      cert_path: "pki/hsm-service/clients/cts-core-trader/cts-core-hsm-trader.crt"
      key_path: "pki/hsm-service/clients/cts-core-trader/cts-core-hsm-trader.key"
  
  # 2FA context (user 2FA secrets - for re-encryption job only)
  two_fa:
    context: "2fa"
    tls:
      enabled: true
      ca_path: "pki/ca/ca.crt"
      cert_path: "pki/hsm-service/clients/cts-core-2fa/cts-core-hsm-2fa.crt"
      key_path: "pki/hsm-service/clients/cts-core-2fa/cts-core-hsm-2fa.key"

# State management
state:
  file_path: "state/daemon.state"
  sync_interval: 30s             # Sync to MySQL every 30 seconds
  backup_count: 3                # Keep 3 backup copies

# Logging configuration
logging:
  level: debug                   # debug | info | warn | error
  format: json                   # json | text
  compress: false                 # Compress rotated files
  error_path: "/var/log/cts-core/error.log"
  access_path: "/var/log/cts-core/access.log"
  out_request_path: "/var/log/cts-core/out_request.log"
  ws_in_path: "/var/log/cts-core/ws_in.log"
  ws_out_path: "/var/log/cts-core/ws_out.log"
  audit_path: "/var/log/cts-core/audit.log"
  max_size_mb: 100               # Rotate when file reaches 100 MB
  max_backups: 10                # Number of rotated files to keep
  max_age_days: 30               # Max age in days before deletion
  access_to_stdout: true
  out_request_to_stdout: false
  ws_in_to_stdout: false
  ws_out_to_stdout: false
  audit_to_stdout: false

# Session management (Phase 1.4)
session:
  heartbeat_interval: 5s
  heartbeat_timeout: 15s         # 3 missed heartbeats; disconnect reason="timeout" when read deadline is exceeded
  write_timeout: 10s             # WAN-friendly WS write/control timeout
  grace_period: 60s
  cleanup_interval: 300s         # 5 minutes
  protocol_version: "2"
  max_payload_bytes: 65536       # 64 KiB
  max_unknown_actions: 5
  unknown_action_window: 10s
  request_dedup_window: 60s

# Task scheduler (Phase 1.4)
scheduler:
  task_assignment_interval: 5s
  latency_check_interval: 20m
  resource_check_interval: 30s
  resource_hard_limit: 0.98       # hard reject when utilization >= this value
  resource_soft_limit: 0.75       # apply score penalty above this value
  resource_soft_penalty_ms: 600   # max soft penalty contribution in score units

# Rate limiting (Phase 1.5)
rate_limit:
  rest:
    requests_per_second: 50
    burst: 100
    
  websocket:
    requests_per_second: 200
    burst: 1000

# Prometheus metrics (Phase 1.6)
metrics:
  enabled: true
  port: 9090
  path: "/metrics"              # includes cts_core_ws_disconnect_* series (no extra config required)

