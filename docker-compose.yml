version: '3.8'

services:
  # CTS-Core application
  cts-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cts-core
    volumes:
      # Config (read-only)
      - ./conf:/app/conf:ro
      # Logs (read-write)
      - ./logs:/app/logs
      # State (read-write)
      - ./state:/app/state
      # PKI certificates (read-only, если есть)
      - ./pki:/app/pki:ro
    networks:
      - hsm-net  # Подключение к hsm-service
    environment:
      # Timezone
      - TZ=Europe/Moscow
      # Override config via ENV (optional)
      - CTS_ENVIRONMENT=development
      # - CTS_DATABASES_SYSTEM_MYSQL_PASSWORD=your_password
      # - CTS_LOG_LEVEL=debug
    # MySQL подключение: используется host.docker.internal или IP хоста
    # В config.yaml: databases.system.mysql.host = "host.docker.internal" (Docker Desktop)
    # или databases.system.mysql.host = "172.17.0.1" (Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Для доступа к MySQL на хосте
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x cts-core >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Uncomment if REST API needed (Phase 1.5):
    # ports:
    #   - "8080:8080"

# Networks
networks:
  hsm-net:
    external: true  # Предполагается что hsm-service уже создал эту сеть
